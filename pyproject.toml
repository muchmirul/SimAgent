[project]
name = "simagent"
version = "0.1.0"
description = "Sandbox-first harness for math conjectures: simulate, visualize in 3D, search for counterexamples/witnesses, then formalize (LaTeX + Lean)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# websocket-client drives headless Chromium over the DevTools protocol in
# tests/test_ui_browser.py. Undeclared, it is present on a developer machine
# that once installed it and absent from every fresh install, so the page tests
# passed locally and failed in CI. The suite must not lose them to a skip: a
# skip nobody notices is how three UI bugs shipped green.
dev = ["pytest>=8", "httpx>=0.27", "websocket-client>=1.7"]
viz = ["manim>=0.18"]

[project.scripts]
simagent = "simagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
